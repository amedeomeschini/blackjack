<!DOCTYPE html>
<html lang="it">
    <head>
        <title>BlackJack - Registrati</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/registrazione.css">
        <script src="js/validazione.js"></script>
        <script>

            // AGGIUNGE EVENT LISTENER PER LA CHIAMATA DI register.php E PER MOSTRA/NASCONI PASSWORD
            function inizializza(){
                const form = document.getElementById("form");

                form.addEventListener("submit", function(event) {
                    event.preventDefault();

                    if(validaRegistrazione()){
                        const credenziali = new FormData(form);
                        
                        fetch("php/register.php", {
                            method: "POST",
                            body: credenziali
                        })
                        .then(response => {
                            if(!response.ok)
                                throw new Error();
                            return response.text();
                        })
                        .then(text => {
                            if (text == true)
                                window.location.href = "tavolo.php";
                            else {
                                const p = document.getElementById("messaggio");
                                p.innerText = text;
                            }
                        })
                        .catch(error => {
                            const p = document.getElementById("messaggio");
                            p.innerText = "Impossibile connettersi al server :/";
                        });
                    }
                
                });
            


                const img1 = document.getElementById("tipoInput1");
                img1.addEventListener("click",(event) => {
                    
                    const input = document.getElementsByName("password")[0];

                    if(input.type == "password"){
                        input.type = "text";
                        img1.setAttribute("src","img/shown.png");
                    } else {
                        input.type = "password";
                        img1.setAttribute("src","img/hidden.png");
                    }
                    event.preventDefault();
                    
                });

                const img2 = document.getElementById("tipoInput2");
                img2.addEventListener("click",(event) => {
                    
                    const input = document.getElementsByName("password2")[0];

                    if(input.type == "password"){
                        input.type = "text";
                        img2.setAttribute("src","img/shown.png");
                    } else {
                        input.type = "password";
                        img2.setAttribute("src","img/hidden.png");
                    }
                    event.preventDefault();
                    
                });
            }
            
        </script>
    </head>

    <body onload="inizializza()">

        <div id="blackjack">BlackJack</div>

        <div id="spazio"></div>

        <div id="registrati">
            <form id="form">
                <input type="text" name="username" placeholder="Nome utente">
                <input type="text" name="email" placeholder="Indirizzo e-mail">

                <div id="sezione_password1">
                    <input type="password" name="password" placeholder="Password">
                    <div><img id="tipoInput1" alt="Mostra/nascondi password" src="img/hidden.png"></div>
                </div>
                <div id="sezione_password2">
                    <input type="password" name="password2" placeholder="Conferma Password">
                    <div><img id="tipoInput2" alt="Mostra/nascondi password" src="img/hidden.png"></div>
                </div>
                <p id="nota">La password deve essere lunga almeno 8 caratteri e contenere almeno un numero e una lettera maiuscola.</p>
                
                <select name="domanda">
                    <option value="">Seleziona la domanda di sicurezza</option>
                    <option value="1">Qual è il nome del tuo animale domestico?</option>
                    <option value="2">Qual era il tuo soprannome da piccolo?</option>
                    <option value="3">Qual è il tuo film preferito?</option>
                </select>
                <input type="text" name="risposta" placeholder="Risposta">
                <div>
                    <hr>
                </div>
                <div>
                    <button type="submit">REGISTRATI</button>
                    <p id="messaggio"><br></p>
                    <p>Hai già un account? <a href="index.html">Accedi</a></p>
                </div>
            </form>
        </div>

    </body>
</html>
